repos:
  - repo: local
    hooks:
      # ruff runs from the project's own locked version (uv.lock), the same one CI's
      # `uv run ruff` uses. A pinned ruff-pre-commit rev drifts behind it, so new rules
      # passed locally and failed CI (#974). Every hook uses `uv run --frozen`, as CI's
      # `uv sync --frozen` does, so a commit never re-locks or rewrites uv.lock.
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # A change to ruff's config or version can fail files the commit doesn't touch, so
      # lint the whole tree exactly as CI does.
      - id: ruff-tree
        name: ruff check (whole tree, ruff config or version changed)
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff-format-tree
        name: ruff format --check (whole tree, ruff config or version changed)
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: gen-tool-docs
        name: Regenerate tool docs
        entry: uv run --frozen python scripts/gen_tool_docs.py
        language: system
        pass_filenames: false
        files: ^(src/mcp_gee_sweet/tools/.*\.py|docs/tools\.md|docs/configuration\.md)$
      - id: qa-md-fixtures
        name: Check generated Markdown QA fixtures are current
        entry: uv run --frozen python scripts/qa_gen_md_fixtures.py --check
        language: system
        pass_filenames: false
        files: ^(docs/qa/fixtures/md/.*|docs/qa/tests/docs_markdown\.md|scripts/qa_gen_md_fixtures\.py)$
      - id: check-supports-all-drives
        name: Check supportsAllDrives on Drive API calls
        entry: uv run --frozen python scripts/check_supports_all_drives.py
        language: system
        pass_filenames: false
        files: ^src/mcp_gee_sweet/.*\.py$
