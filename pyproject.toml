[project]
name = "mcp-gee-sweet"
dynamic = ["version"]
description = "MCP server for Google Workspace — Sheets, Drive, Docs (HTML or Markdown), and Calendar."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "mcp",
    "model-context-protocol",
    "google-workspace",
    "google-sheets",
    "google-docs",
    "google-drive",
    "google-calendar",
    "claude",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.199.0",
    "markdown>=3.10.3",
    "openpyxl>=3.1.5",
    "Pillow>=11.0.0",
    # floor pins for transitive CVEs — ensures safe resolution for downstream consumers
    "starlette>=1.6.0",
    "cryptography>=50.0.0",
    "python-multipart>=0.0.31",
    "python-dotenv>=1.2.3",
]
[[project.authors]]
name = "Kevin Huisman"
email = "khuisman@users.noreply.github.com"

[project.urls]
"Homepage" = "https://github.com/khuisman/mcp-gee-sweet"
"Bug Tracker" = "https://github.com/khuisman/mcp-gee-sweet/issues"
"Repository" = "https://github.com/khuisman/mcp-gee-sweet.git"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern = "default"
strict = false
fallback-version = "0.0.0"
# bump the base version past the last tag so dev builds outrank the already-published
# stable release under PEP 440 (X.Y.Z.devN otherwise sorts below a shipped X.Y.Z) — #317
bump = true
# omit local git hash (+abc1234) — PyPI rejects local version identifiers (PEP 440)
format-jinja = "{% if distance == 0 %}{{ base }}{% else %}{{ base }}.dev{{ distance }}{% endif %}"

[project.scripts]
mcp-gee-sweet = "mcp_gee_sweet:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_fs: hits real Google APIs via a live mcp-gee-sweet subprocess; opt-in, see docs/qa/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mike>=2.2.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "tomli>=2.0.1; python_version < '3.11'",
]
