[project]
name = "mcp-gee-sweet"
dynamic = ["version"]
description = "MCP server for Google Workspace — Sheets, Drive, Docs, and Calendar. 60+ tools for AI clients."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0,<2.0.0",
    "google-auth>=2.28.1",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.117.0",
    "markdown>=3.10.2",
    "openpyxl>=3.1.0",
    # floor pins for transitive CVEs — ensures safe resolution for downstream consumers
    "starlette>=1.3.1",
    "cryptography>=48.0.1",
    "python-multipart>=0.0.31",
]
[[project.authors]]
name = "Kevin Huisman"
email = "khuisman@users.noreply.github.com"

[project.urls]
"Homepage" = "https://github.com/khuisman/mcp-gee-sweet"
"Bug Tracker" = "https://github.com/khuisman/mcp-gee-sweet/issues"
"Repository" = "https://github.com/khuisman/mcp-gee-sweet.git"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern = "default"
strict = false
fallback-version = "0.0.0"
# omit local git hash (+abc1234) — PyPI rejects local version identifiers (PEP 440)
format-jinja = "{% if distance == 0 %}{{ base }}{% else %}{{ base }}.dev{{ distance }}{% endif %}"

[project.scripts]
mcp-gee-sweet = "mcp_gee_sweet:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.12",
]
