# QA Operations — mcp-gee-sweet
#
# Machine-readable manifest of available QA operations.
# An AI reading this file can parse the operations, check preconditions
# against the current environment, and offer them as a menu.
#
# How to use:
#   "Read docs/qa/operations.yaml and tell me what QA operations are available."
#   "Read docs/qa/operations.yaml and run the setup_fixtures operation."
#   "Read docs/qa/operations.yaml and run the run_group operation for sheets_read."

version: "1"
env_file: ".env"

fixture_keys:
  # All keys are optional — only set what you need for the groups you're running.
  # A missing key causes that group's tests to be skipped, not a hard error.
  optional:
    - TEST_SPREADSHEET_ID   # needed for: read, write, sheets, charts groups
    - TEST_DOC_ID           # needed for: drive (write_doc_content tests)
    - TEST_FOLDER_ID        # needed for: drive group
    - TEST_CALENDAR_ID      # needed for: calendar group
    - TEST_EVENT_ID         # needed for: calendar group

operations:

  - id: setup_fixtures
    name: Setup QA Fixtures
    description: >
      Create and populate the QA spreadsheet and doc with known fixture data,
      then write their IDs to .env. Run once per environment. If TEST_* keys
      are already set, ask the user whether to reuse existing files or start fresh.
    preconditions:
      - "A writable Drive folder URL or ID is available (user provides, or TEST_FOLDER_ID is in .env)"
      - "Auth is configured: one of SERVICE_ACCOUNT_PATH, CREDENTIALS_CONFIG, CREDENTIALS_PATH, or ADC"
    notes:
      service_account: >
        If using service account auth (SERVICE_ACCOUNT_PATH or CREDENTIALS_CONFIG),
        the Drive folder and both files must be shared with the service account email.
        Find it in service_account.json → client_email. The service account cannot
        access files in personal Drive unless explicitly shared.
    prompt: |
      Set up QA fixtures for mcp-gee-sweet.

      1. Read .env. If TEST_SPREADSHEET_ID and TEST_DOC_ID are already set, ask
         whether to reuse the existing files or start fresh with new ones.
      2. Check the auth method: read QA_AUTH_METHOD from .env (default: service_account).

      If auth is "oauth" or "adc":
        3a. Ask the user for a Drive folder URL or ID (or use TEST_FOLDER_ID from .env).
        3b. Use create_spreadsheet to create "mcp-gee-sweet-qa-fixtures" in that folder.
        3c. Use create_doc (if available) or ask the user to create a blank Google Doc named
            "mcp-gee-sweet-qa-fixtures-doc" in the same folder.
        3d. Collect both IDs and proceed to step 5.

      If auth is "service_account":
        3a. Ask the user for a Drive folder URL or ID (or use TEST_FOLDER_ID from .env).
        3b. List files in the folder. Look for "mcp-gee-sweet-qa-fixtures" (spreadsheet)
            and "mcp-gee-sweet-qa-fixtures-doc" (doc).
        3c. If files are missing, tell the user: "Create a blank spreadsheet and a blank
            Google Doc in that folder, then share both with [service account email from
            service_account.json → client_email]. Come back when done." Wait for confirmation.

      4. Once you have both IDs, populate them by following the reset_fixtures operation.
      5. Write TEST_SPREADSHEET_ID, TEST_DOC_ID, and TEST_FOLDER_ID to .env.
      6. Confirm the IDs written and ask the user to verify the files look correct in Drive.

  - id: reset_fixtures
    name: Reset Fixtures to Known State
    description: >
      Re-populate the QA spreadsheet and doc with known fixture data.
      Run after destructive tests, or any time fixture state is uncertain.
      Covers spreadsheet and doc only — calendar fixtures are separate (see setup.md).
    preconditions:
      - "TEST_SPREADSHEET_ID present in .env (spreadsheet reset)"
      - "TEST_DOC_ID present in .env (doc reset)"
      - "Either or both can be omitted to reset only the other"
    prompt: |
      Reset QA fixtures for mcp-gee-sweet to known state.

      Read TEST_SPREADSHEET_ID and TEST_DOC_ID from .env.

      Spreadsheet: ensure sheets "Sales", "Empty", and "Notes & Misc" exist.
      Create any that are missing. Then:

        Clear and repopulate Sales (A1:D6):
          Row 1: Product, Q1, Q2, Q3
          Row 2: Widget, 100, 120, 140
          Row 3: Gadget, 200, 180, 220
          Row 4: Donut, 50, 60, 55
          Row 5: Gizmo, 300, 310, 290
          Row 6: Totals, =SUM(B2:B5), =SUM(C2:C5), =SUM(D2:D5)

        Clear Empty completely (leave blank).

        Clear and repopulate Notes & Misc (A1:B2):
          Row 1: Date, Note
          Row 2: =TODAY(), Setup complete

      Doc: write this HTML to TEST_DOC_ID:
        <h1>Test Document</h1><p>This document is used for QA testing of mcp-gee-sweet.</p><ul><li>Item one</li><li>Item two</li></ul>

      Confirm when done.

  - id: run_suite
    name: Run Full QA Suite
    description: >
      Run all test categories against the live MCP server in order: infra, read,
      write, sheets, drive, charts, calendar. AI evaluates each check; results
      saved to docs/qa/results/YYYY-MM-DD.md. Groups whose required fixture IDs
      are absent in .env are skipped automatically — you don't have to set everything
      to run a subset.
    preconditions:
      - "mcp-gee-sweet tools available in this session (server running and connected)"
      - "At least one fixture ID set in .env — see fixture_keys for which IDs each group needs"
    prompt: |
      Follow the conductor prompt in docs/qa/run.md exactly.
      Run the full suite — do not limit to any single category.
      Before running any tests, check QA_AUTH_METHOD in .env and issue a pre-run warning (see auth_warning below).

  - id: run_group
    name: Run QA Group
    description: >
      Run test cases for one tool category only. Useful for focused testing after
      a change, or for breaking a full run into human-sized sessions.
    parameters:
      - name: group
        required: true
        type: enum
        values:
          sheets_read:   "Sheets read tools (TC-R##) — get_sheet_data, get_sheet_formulas, get_multiple_sheet_data, find_in_spreadsheet"
          sheets_write:  "Sheets write tools (TC-W##) — update_cells, batch_update_cells, add_rows, add_columns"
          sheets_mgmt:   "Sheets management tools (TC-S##) — create_sheet, rename_sheet, copy_sheet, list_sheets"
          sheets_charts: "Sheets chart tools (TC-C##) — add_chart"
          drive:         "Drive + Docs tools (TC-D##) — list_files, list_folders, list_spreadsheets, search_spreadsheets, share_spreadsheet, create_spreadsheet, write_doc_content. NOTE: many tests are marked ⚠️ requires-oauth or ⚠️ local-filesystem — see pre-run warning."
          calendar:      "Calendar tools (TC-CAL##) — requires TEST_CALENDAR_ID and TEST_EVENT_ID"
          infra:         "Infrastructure (TC-I##) — server startup, auth, caching, tool filtering, refresh_cache"
    preconditions:
      - "mcp-gee-sweet tools available in this session"
      - "Fixture ID(s) for the requested group present in .env (see fixture_keys)"
      - "sheets_read/sheets_write/sheets_mgmt/sheets_charts: TEST_SPREADSHEET_ID"
      - "drive: TEST_SPREADSHEET_ID + TEST_DOC_ID + TEST_FOLDER_ID"
      - "calendar: TEST_CALENDAR_ID + TEST_EVENT_ID"
      - "infra: no fixture IDs required"
    prompt: |
      Follow the conductor prompt in docs/qa/run.md, but only run
      docs/qa/tests/{{group}}.md — skip all other test files.
      Before running any tests, check QA_AUTH_METHOD in .env and issue a pre-run warning (see auth_warning below).

  - id: auth_warning
    name: Pre-run Auth Warning (internal — called by run_suite and run_group)
    description: >
      Not invoked directly. Called at the start of run_suite and run_group to
      check QA_AUTH_METHOD and warn the user about tests that will be skipped.
    prompt: |
      Read QA_AUTH_METHOD from .env (default: service_account if missing).

      Display a pre-run summary like this — adjust the counts to match the
      group(s) being run:

      ---
      Auth method: {{QA_AUTH_METHOD}}

      Coverage impact:
        service_account — ~85% of non-calendar tests runnable. Drive file
          creation, copy, and upload tests are skipped (service accounts have
          no Drive storage quota). Local filesystem tests are always skipped
          in an AI session regardless of auth.

        oauth / adc — ~95% of non-calendar tests runnable. All Drive create/
          copy/upload tests are eligible. Local filesystem tests still skipped
          in an AI session.

      Tests that will be skipped in this run:
        ⚠️ requires-oauth  (~22 Drive tests + TC-I10): {{skipped if service_account, none if oauth/adc}}
        ⚠️ local-filesystem (~32 Drive tests): always skipped in AI sessions
        Calendar: skipped (TEST_CALENDAR_ID not set)

      See CONTRIBUTING.md for auth method pros/cons and how to switch.
      Skipped tests are recorded as SKIP(requires-oauth) or SKIP(local-filesystem).
      ---

      Ask: "Proceed with the run?" and wait for confirmation before continuing.

  - id: human_confirmation
    name: Human Sign-off Flow
    description: >
      Step through test cases one at a time. AI presents each prompt and its
      evaluation; human confirms the final verdict. Verdicts are recorded in
      docs/qa/results/YYYY-MM-DD.md. This is Phase 2 of the verification model
      described in docs/decisions/decision-testing.md.
    parameters:
      - name: group
        required: false
        type: enum
        description: "Limit to one category. If omitted, steps through all categories in order."
        values:
          sheets_read:   "Sheets read tools (TC-R##) — get_sheet_data, get_sheet_formulas, get_multiple_sheet_data, find_in_spreadsheet"
          sheets_write:  "Sheets write tools (TC-W##) — update_cells, batch_update_cells, add_rows, add_columns"
          sheets_mgmt:   "Sheets management tools (TC-S##) — create_sheet, rename_sheet, copy_sheet, list_sheets"
          sheets_charts: "Sheets chart tools (TC-C##) — add_chart"
          drive:         "Drive + Docs tools (TC-D##) — list_files, list_folders, list_spreadsheets, search_spreadsheets, share_spreadsheet, create_spreadsheet, write_doc_content"
          calendar:      "Calendar tools (TC-CAL##) — requires TEST_CALENDAR_ID and TEST_EVENT_ID"
          infra:         "Infrastructure (TC-I##) — server startup, auth, caching, tool filtering, refresh_cache"
    preconditions:
      - "mcp-gee-sweet tools available in this session"
      - "Fixture ID(s) for the requested group present in .env (see fixture_keys)"
    prompt: |
      Run QA tests for mcp-gee-sweet in human confirmation mode.
      {{#if group}}Only run docs/qa/tests/{{group}}.md.{{/if}}

      Read fixture IDs from .env.

      For each test case:
      1. Announce the TC number and title.
      2. Show the prompt with fixture IDs substituted.
      3. Execute it using MCP tools.
      4. Show the result and each check item with your evaluation: PASS, FAIL, or UNCERTAIN.
         For UNCERTAIN, explain what you can't determine from the response alone.
      5. Wait for me to confirm: "pass", "fail [reason]", or "skip [reason]".
      6. Record my verdict — not your evaluation — in the results.
      7. For tests marked ⚠️ destructive: ask before running.

      After each test file, summarize results and ask if I want to continue.
      Save results to docs/qa/results/{{date}}.md when done or when I say "stop".
