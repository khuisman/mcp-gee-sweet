# Every PyPI upload (dev and stable) comes from this one file. PyPI flags a
# release whose trusted-publisher workflow differs from the previous
# release's ("Change of provenance"), and a dev build always precedes a
# stable release, so the two tracks must share a workflow file (#1124).
# PyPI's trusted publisher is registered for this exact filename: don't
# rename it without registering the new name on PyPI first.
name: Publish

on:
  # Dev track: every qualifying push to develop publishes a .devN version.
  push:
    branches: ["develop"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  # Stable track: publishing a GitHub release publishes its tag's version.
  release:
    types: [published]

permissions:
  contents: read  # default minimal; pypi-publish job overrides with id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so uv-dynamic-versioning can read tags

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev --python 3.12

      - name: Run tests
        run: uv run python -m pytest --tb=short

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so uv-dynamic-versioning can read tags

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev --python 3.12

      - name: Build package
        run: uv build

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dists
          path: dist/

  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # for OIDC trusted publishing

    steps:
      - name: Download dists
        uses: actions/download-artifact@v8
        with:
          name: dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # At distance 0 from a tag the dev track builds the bare stable
          # version (e.g. develop fast-forwarded onto a release tag that
          # carried a hotfix), which the release run already uploaded. Skip
          # that duplicate on push; a stable release still fails loudly.
          skip-existing: ${{ github.event_name == 'push' }}
