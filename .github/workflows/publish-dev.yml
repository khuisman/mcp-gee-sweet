name: Publish dev

on:
  push:
    branches: ["develop"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read
  id-token: write  # for OIDC trusted publishing

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so uv-dynamic-versioning can read tags

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev --python 3.12

      - name: Run tests
        run: uv run python -m pytest --tb=short

  build-and-publish:
    name: Build and publish dev release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so uv-dynamic-versioning can read tags

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev --python 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
