site_name: mcp-gee-sweet
site_description: MCP server for Google Workspace — Sheets, Drive, Docs, Calendar
site_url: https://khuisman.github.io/mcp-gee-sweet
repo_url: https://github.com/khuisman/mcp-gee-sweet
repo_name: khuisman/mcp-gee-sweet

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy

plugins:
  - search  # explicit — defining plugins: disables the implicit default search plugin
  - mike    # per-version canonical URLs + version-aware `mike serve`; pairs with extra.version below

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra:
  version:
    provider: mike
    default: latest  # non-latest versions (old releases, develop) show the "outdated" banner

nav:
  - Home: index.md
  - Reference:
    - Tools: tools.md
    - Authentication: auth.md
    - Configuration: configuration.md
    - Client Setup: client-setup.md
  - Design:
    - Principles: design.md
    - Design Docs: design/index.md
    - Docs AST Pipeline: design/docs-ast-pipeline.md
  - Decisions:
    - Index: decisions/index.md
    - Project Fork: decisions/decision-fork.md
    - Composite Tools: decisions/decision-composite-tools.md
    - Testing Approach: decisions/decision-testing.md
    - Publishing Strategy: decisions/decision-publishing.md
  - Roadmap: roadmap.md
  - Development:
    - QA Overview: qa/README.md
    - QA Setup: qa/setup.md
    - QA Run Guide: qa/run.md
    - QA Fixtures: qa/fixtures.template.md
    - Test Cases:
      - Calendar: qa/tests/calendar.md
      - Docs: qa/tests/docs.md
      - Drive: qa/tests/drive.md
      - Infrastructure: qa/tests/infra.md
      - Sheets — Read: qa/tests/sheets_read.md
      - Sheets — Write: qa/tests/sheets_write.md
      - Sheets — Charts: qa/tests/sheets_charts.md
      - Sheets — Structure: qa/tests/sheets_mgmt.md
    - Read API Notes: notes-read.md
